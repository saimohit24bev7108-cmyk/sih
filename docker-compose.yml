version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: fixflow_user
      POSTGRES_PASSWORD: fixflow_password
      POSTGRES_DB: fixflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
